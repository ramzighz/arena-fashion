<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Dynamic Title & Meta -->
    <title>Your Business Name | Your Products & Services</title>
    <meta name="description" content="Your business description goes here. We offer premium products and exceptional service." />
    <meta name="keywords" content="your products, your services, your industry, premium quality" />
    <meta name="author" content="Your Business Name" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#090a0f" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Business Name | Your Tagline" />
    <meta property="og:description" content="Your business description for social media sharing." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1542272604-780c96856592?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:url" content="https://yourbusiness.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Business Name | Your Tagline" />
    <meta name="twitter:description" content="Your business description for social media sharing." />

    <!-- Favicon SVG (Custom) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23090a0f'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23f5f3ef' font-size='16' font-family='sans-serif' font-weight='bold'%3EY%3C/text%3E%3C/svg%3E" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Your Business Name",
        "image": "https://images.unsplash.com/photo-1542272604-780c96856592?auto=format&fit=crop&w=1200&q=80",
        "description": "Your business description for search engines.",
        "url": "https://yourbusiness.com",
        "telephone": "+1-555-123-4567",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Main Street",
          "addressLocality": "Your City",
          "addressRegion": "ST",
          "postalCode": "12345",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 0,
          "longitude": 0
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Sunday"],
            "opens": "12:00",
            "closes": "18:00"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-milano-50 dark:bg-obsidian text-milano-900 dark:text-milano-100 transition-colors duration-200 antialiased overflow-x-hidden min-h-screen">
    <!-- Accessible Skip to Content Link -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-milano-900 focus:text-white focus:rounded-md focus:shadow-lg focus:outline-none">
      Skip to main content
    </a>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
